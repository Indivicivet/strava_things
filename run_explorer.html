<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run explorer</title>
<style>

:root{color-scheme:dark;font:14px system-ui;background:#0b1017;color:#e8edf2}
*{box-sizing:border-box}body{margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:100vh}
aside{grid-column:2;grid-row:1;padding:18px;overflow:auto;border-left:1px solid #263241;background:#101923}
.map{grid-column:1;grid-row:1;position:relative;min-width:0;min-height:300px;background:#0b1017}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
label{display:block;color:#aebdca;margin:16px 0 5px}select,input,button{font:inherit;background:#1a2735;border:1px solid #405164;color:#edf5fa;border-radius:6px;padding:8px}
select,input{width:100%}button{cursor:pointer}button:hover{border-color:#66d7c4}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #74e2ca;outline-offset:2px}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1;min-width:0}.hint{color:#9daebb;font-size:12px}
.modes{display:flex;margin-top:14px}.modes label{flex:1;margin:0;position:relative}.modes input{position:absolute;opacity:0;width:1px;height:1px}.modes span{display:block;text-align:center;padding:8px;border:1px solid #405164;background:#1a2735;cursor:pointer}.modes label:first-child span{border-radius:6px 0 0 6px}.modes label:last-child span{border-radius:0 6px 6px 0;border-left:0}.modes input:checked+span{background:#245a57;color:#fff;border-color:#74e2ca}.modes input:focus-visible+span{outline:2px solid #74e2ca;outline-offset:2px}
.overlay{position:absolute;left:16px;bottom:14px;background:#111c28dd;padding:8px 12px;border-radius:6px;pointer-events:none;color:#b7c8d4}
#summary{margin-top:18px;font-size:16px}strong{color:#74e2ca}#details{margin-top:16px;line-height:1.5;color:#f5df9b}#runs{margin-top:10px}.run{display:block;width:100%;text-align:left;margin:4px 0;font-size:13px}.selected{border-color:#ffdf75;color:#ffdf75}
@media(max-width:700px){main{display:flex;flex-direction:column;height:auto}aside{border:0}.map{height:60vh;order:-1}#runs{max-height:200px;overflow:auto}}
</style></head><body><main><aside>
<select id="region" aria-label="Broad area"><option value="all">All areas</option></select>
<button id="nameAreas" style="width:100%;margin-top:8px">Name areas online</button><div class="hint">Sends approximate area centres to OpenStreetMap Nominatim.</div><div class="modes" role="radiogroup" aria-label="View"><label><input type="radio" name="mode" value="routes" checked><span>Routes</span></label><label><input type="radio" name="mode" value="heat"><span>Heat</span></label></div>
<div class="row"><div><label for="from">From</label><input id="from" type="date"></div><div><label for="to">To</label><input id="to" type="date"></div></div>
<div class="row"><button id="fit">Fit runs</button><button id="export">Export PNG</button></div>
<div id="summary">Loading runs…</div><div id="details">Select a route on the map or a run below to see its details.</div><div id="runs"></div>
</aside><section class="map"><canvas id="map"></canvas><div class="overlay">Scroll to zoom · drag to pan · click a route to select</div></section></main>
<script>
const $=id=>document.getElementById(id), canvas=$('map'), ctx=canvas.getContext('2d');
let data=[], groups=[], visible=[], selected=null, view={x:0,y:0,scale:1}, drag=null;
const palette=['#60d8e8','#ff967b','#a9e878','#dca2ff','#ffce5c','#71aaff','#ed8bcb','#b8d6a0'];
function color(r){return palette[r.colorIndex%palette.length]}
function areaText(g){return `${g.name||`Area ${g.index+1}`} · ${g.runs.length} runs`}
async function nameAreas(){
 const button=$('nameAreas');button.disabled=true;button.textContent='Naming areas…';
 let failed=0;
 for(const g of groups){
  try{
   const lat=Math.atan(Math.sinh(g.center[1]))*180/Math.PI,lon=g.center[0]*180/Math.PI;
   const response=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=${lat}&lon=${lon}`);
   if(!response.ok)throw new Error('Lookup failed');
   const result=await response.json(),a=result.address||{};
   g.name=a.city||a.town||a.village||a.municipality||a.county||null;
   if(!g.name)failed++;
   $('region').options[g.index+1].textContent=areaText(g);
  }catch(error){failed++}
  await new Promise(resolve=>setTimeout(resolve,1100));
 }
 button.textContent=failed?`Name areas online (${failed} unavailable)`:'Area names loaded';button.disabled=false;draw();
}
// Web Mercator gives locally useful proportions without loading a third-party basemap.
function project(p){let lat=Math.max(-85,Math.min(85,p[0]))*Math.PI/180;return [p[1]*Math.PI/180,Math.log(Math.tan(Math.PI/4+lat/2))]}
function screen(p){return [(p[0]-view.x)*view.scale+canvas.clientWidth/2,canvas.clientHeight/2-(p[1]-view.y)*view.scale]}
function buildGroups(){
 for(const r of data){let center=r.xy.reduce((a,p)=>[a[0]+p[0]/r.xy.length,a[1]+p[1]/r.xy.length],[0,0]);r.center=center;
 // Roughly 50 km at the equator, adjusted by latitude through Mercator.
 let g=groups.find(g=>Math.hypot(center[0]-g.center[0],center[1]-g.center[1])*6371*Math.cos(r.points[0][0]*Math.PI/180)<50);
 if(!g){g={center, runs:[]};groups.push(g)}g.runs.push(r);r.group=g;
 }groups.sort((a,b)=>b.runs.length-a.runs.length);groups.forEach((g,i)=>{g.index=i;let lat=Math.atan(Math.sinh(g.center[1]))*180/Math.PI,lon=g.center[0]*180/Math.PI;let o=document.createElement('option');o.value=i;o.textContent=`Area ${i+1} · ${lat.toFixed(2)}°, ${lon.toFixed(2)}° · ${g.runs.length} runs`;$('region').append(o)})
}
function filter(){let group=$('region').value,from=$('from').value,to=$('to').value;visible=data.filter(r=>(group==='all'||r.group.index==group)&&(!from||r.date&&r.date.slice(0,10)>=from)&&(!to||r.date&&r.date.slice(0,10)<=to));if(!visible.includes(selected))selected=null;update();fit()}
function fit(){let pts=visible.flatMap(r=>r.xy);if(!pts.length){draw();return}let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(let p of pts){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1])}view={x:(minX+maxX)/2,y:(minY+maxY)/2,scale:Math.min((canvas.clientWidth-60)/Math.max(maxX-minX,.0001),(canvas.clientHeight-60)/Math.max(maxY-minY,.0001))};draw()}
function path(r){ctx.beginPath();r.xy.forEach((p,i)=>{let [x,y]=screen(p);if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)})}
// Bin screen-space GPS samples, then blur and colour their weighted density.
function heat(w,h){
 const width=Math.max(1,Math.ceil(w/2)),height=Math.max(1,Math.ceil(h/2)),counts=new Float32Array(width*height),samples=[];
 let peak=0,peakX=0,peakY=0;
 for(const r of visible)for(let i=0;i<r.xy.length;i++){
  const [x,y]=screen(r.xy[i]),ix=Math.floor(x/2),iy=Math.floor(y/2);
  if(ix<0||iy<0||ix>=width||iy>=height)continue;
  const index=iy*width+ix;samples.push([index,x,y,Math.max(0,r.points[i][2]??1),r.points[i][0]]);
  if(++counts[index]>peak){peak=counts[index];peakX=x;peakY=y}
 }
 counts.fill(0);let max=0;
 for(const [index,x,y,v,lat] of samples){
  const km=Math.hypot(x-peakX,y-peakY)/view.scale*6371*Math.cos(lat*Math.PI/180);
  counts[index]+=v*Math.sqrt(km);max=Math.max(max,counts[index]);
 }
 if(!max)return;
 const layer=document.createElement('canvas');layer.width=width;layer.height=height;const c=layer.getContext('2d'),img=c.createImageData(width,height);
 for(let i=0;i<counts.length;i++)img.data[i*4+3]=Math.round(255*counts[i]/max);
 c.putImageData(img,0,0);const blurred=document.createElement('canvas');blurred.width=width;blurred.height=height;const b=blurred.getContext('2d');b.filter='blur(2px)';b.drawImage(layer,0,0);const pixels=b.getImageData(0,0,width,height);
 let top=0;for(let i=3;i<pixels.data.length;i+=4)top=Math.max(top,pixels.data[i]);
 const stops=[[0,0,4],[45,11,89],[120,28,109],[196,60,78],[249,142,9],[252,255,164]];
 for(let i=0;i<pixels.data.length;i+=4){let a=pixels.data[i+3];if(!a){pixels.data[i+3]=0;continue}let t=Math.log1p(a)/Math.log1p(top),pos=t*(stops.length-1),j=Math.min(stops.length-2,Math.floor(pos)),f=pos-j;for(let k=0;k<3;k++)pixels.data[i+k]=Math.round(stops[j][k]*(1-f)+stops[j+1][k]*f);pixels.data[i+3]=255}
 b.putImageData(pixels,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(blurred,0,0,w,h);
}
function drawAreas(){
 if($('region').value!=='all')return;
 for(const g of groups){const runs=visible.filter(r=>r.group===g);if(!runs.length)continue;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const r of runs)for(const p of r.xy){const [x,y]=screen(p);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}
  const radius=Math.hypot(maxX-minX,maxY-minY)/2;if(radius>24)continue;
  const x=(minX+maxX)/2,y=(minY+maxY)/2;ctx.strokeStyle='rgba(218,232,240,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,Math.max(12,radius+5),0,2*Math.PI);ctx.stroke();
  if(g.name){ctx.fillStyle='#e8edf2';ctx.font='12px system-ui';ctx.fillText(g.name,x+16,y-10)}
 }
}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,d=window.devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#0b1017';ctx.fillRect(0,0,w,h);ctx.lineCap='round';ctx.lineJoin='round';
 if(document.querySelector('input[name=mode]:checked').value==='heat')heat(w,h);else{for(let r of visible){if(r===selected)continue;ctx.globalAlpha=.65;ctx.strokeStyle=color(r);ctx.lineWidth=1.2;path(r);ctx.stroke()}ctx.globalAlpha=1}
 if(selected){ctx.strokeStyle='#ffdf75';ctx.lineWidth=3;path(selected);ctx.stroke()}drawAreas()}
function fmt(r){let km=r.distance/1000,pace=r.duration>0&&km>0?r.duration/km:null;return `${km.toFixed(2)} km · ${pace?Math.floor(Math.round(pace)/60)+':'+String(Math.round(pace)%60).padStart(2,'0')+' /km':'pace unavailable'}`}
function update(){let km=visible.reduce((n,r)=>n+r.distance,0)/1000;$('summary').innerHTML=`<strong>${visible.length}</strong> runs · <strong>${km.toFixed(1)} km</strong><br><span class="hint">Pace uses elapsed stream time, including stops.</span>`;$('details').textContent=selected?`${selected.date?selected.date.slice(0,10):'Date unavailable'} · ${fmt(selected)} · ID ${selected.id}`:'Select a route on the map or a run below to see its details.';let list=$('runs');list.replaceChildren();for(let r of visible){let b=document.createElement('button');b.className='run'+(r===selected?' selected':'');b.textContent=`${r.date?r.date.slice(0,10):'Unknown date'} · ${fmt(r)}`;b.style.borderLeft=`4px solid ${color(r)}`;b.onclick=()=>{selected=selected===r?null:r;update();draw()};list.append(b)}}
function distanceToSegment(x,y,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)}
canvas.addEventListener('pointerdown',e=>{drag={x:e.offsetX,y:e.offsetY,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.abs(dx)+Math.abs(dy)>1)drag.moved=true;view.x-=dx/view.scale;view.y+=dy/view.scale;drag.x=e.offsetX;drag.y=e.offsetY;draw()});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){let best=8,found=null;for(let r of selected?[selected,...visible.filter(r=>r!==selected)]:visible){for(let i=1;i<r.xy.length;i++){let dist=distanceToSegment(e.offsetX,e.offsetY,screen(r.xy[i-1]),screen(r.xy[i]));if(dist<best){best=dist;found=r;if(r===selected)best=0}}}selected=found===selected?null:found;update();draw()}drag=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();let x=e.offsetX-canvas.clientWidth/2,y=canvas.clientHeight/2-e.offsetY,old=view.scale;view.scale*=Math.exp(-e.deltaY*.001);view.x+=x/old-x/view.scale;view.y+=y/old-y/view.scale;draw()},{passive:false});
$('nameAreas').onclick=nameAreas;$('region').onchange=filter;$('from').onchange=filter;$('to').onchange=filter;document.querySelectorAll('input[name=mode]').forEach(input=>input.onchange=draw);$('fit').onclick=fit;$('export').onclick=()=>{let a=document.createElement('a');a.download='run-explorer.png';a.href=canvas.toDataURL('image/png');a.click()};window.addEventListener('resize',draw);
fetch('/data').then(r=>r.json()).then(rows=>{data=rows;for(let [i,r] of data.entries()){r.colorIndex=i;r.xy=r.points.map(project)}buildGroups();filter();if(!data.length)$('summary').textContent='No runs with GPS data found in my_data.'}).catch(()=>{$('summary').textContent='Could not load run data. Start the app with run_explorer.py.'});
</script></body></html>
