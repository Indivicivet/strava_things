<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run explorer</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#0c1118;color:#e8edf2}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #263241}h1{margin:0;font-size:21px}header p,.hint{color:#9daebb;margin:5px 0}main{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 80px)}aside{padding:18px;overflow:auto;border-right:1px solid #263241}label{display:block;color:#aebdca;margin:16px 0 5px}select,input,button{font:inherit;background:#1a2735;border:1px solid #405164;color:#edf5fa;border-radius:6px;padding:8px}select,input{width:100%}button{cursor:pointer}button:hover{border-color:#66d7c4}.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}.map{position:relative;min-width:0;min-height:300px;background:#0b1017}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}.overlay{position:absolute;left:16px;bottom:14px;background:#111c28dd;padding:8px 12px;border-radius:6px;pointer-events:none;color:#b7c8d4}.card{background:#182431;border-radius:8px;padding:12px;margin-top:16px;line-height:1.6}strong{color:#74e2ca}#runs{max-height:260px;overflow:auto;margin-top:10px}.run{display:block;width:100%;text-align:left;margin:4px 0;font-size:13px}.selected{border-color:#76e1c8;color:#76e1c8}@media(max-width:700px){main{display:flex;flex-direction:column;height:auto}aside{border:0}.map{height:60vh;order:-1}#runs{max-height:130px}}
</style></head><body><header><h1>Run explorer</h1><p>Your routes, locally on your computer</p></header><main><aside>
<label for="region">Broad area</label><select id="region"><option value="all">All areas</option></select><p class="hint">Areas are grouped by nearby run centres; coordinates are approximate.</p>
<label for="mode">View</label><select id="mode"><option value="routes">Routes</option><option value="heat">Heat</option></select>
<div class="row"><div><label for="from">From</label><input id="from" type="date"></div><div><label for="to">To</label><input id="to" type="date"></div></div>
<div class="row"><button id="fit">Fit runs</button><button id="export">Export PNG</button></div>
<div class="card" id="summary">Loading runs…</div><div class="card" id="details">Select a route on the map or a run below to see its details.</div><div id="runs"></div>
</aside><section class="map"><canvas id="map"></canvas><div class="overlay">Scroll to zoom · drag to pan · click a route to select</div></section></main>
<script>
const $=id=>document.getElementById(id), canvas=$('map'), ctx=canvas.getContext('2d');
let data=[], groups=[], visible=[], selected=null, view={x:0,y:0,scale:1}, drag=null;
// Web Mercator gives locally useful proportions without loading a third-party basemap.
function project(p){let lat=Math.max(-85,Math.min(85,p[0]))*Math.PI/180;return [p[1]*Math.PI/180,Math.log(Math.tan(Math.PI/4+lat/2))]}
function screen(p){return [(p[0]-view.x)*view.scale+canvas.clientWidth/2,canvas.clientHeight/2-(p[1]-view.y)*view.scale]}
function buildGroups(){
 for(const r of data){let center=r.xy.reduce((a,p)=>[a[0]+p[0]/r.xy.length,a[1]+p[1]/r.xy.length],[0,0]);r.center=center;
 // Roughly 50 km at the equator, adjusted by latitude through Mercator.
 let g=groups.find(g=>Math.hypot(center[0]-g.center[0],center[1]-g.center[1])*6371*Math.cos(r.points[0][0]*Math.PI/180)<50);
 if(!g){g={center, runs:[]};groups.push(g)}g.runs.push(r);r.group=g;
 }groups.sort((a,b)=>b.runs.length-a.runs.length);groups.forEach((g,i)=>{g.index=i;let lat=Math.atan(Math.sinh(g.center[1]))*180/Math.PI,lon=g.center[0]*180/Math.PI;let o=document.createElement('option');o.value=i;o.textContent=`Area ${i+1} · ${lat.toFixed(2)}°, ${lon.toFixed(2)}° · ${g.runs.length} runs`;$('region').append(o)})
}
function filter(){let group=$('region').value,from=$('from').value,to=$('to').value;visible=data.filter(r=>(group==='all'||r.group.index==group)&&(!from||r.date&&r.date.slice(0,10)>=from)&&(!to||r.date&&r.date.slice(0,10)<=to));if(!visible.includes(selected))selected=null;update();fit()}
function fit(){let pts=visible.flatMap(r=>r.xy);if(!pts.length){draw();return}let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(let p of pts){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1])}view={x:(minX+maxX)/2,y:(minY+maxY)/2,scale:Math.min((canvas.clientWidth-60)/Math.max(maxX-minX,.0001),(canvas.clientHeight-60)/Math.max(maxY-minY,.0001))};draw()}
function path(r){ctx.beginPath();r.xy.forEach((p,i)=>{let [x,y]=screen(p);if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)})}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,d=window.devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#0b1017';ctx.fillRect(0,0,w,h);ctx.lineCap='round';ctx.lineJoin='round';
 if($('mode').value==='heat'){ctx.globalCompositeOperation='screen';ctx.shadowBlur=12;ctx.shadowColor='#ff5a12';ctx.strokeStyle='rgba(255,100,12,.13)';ctx.lineWidth=4;for(let r of visible){path(r);ctx.stroke()}ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over'}else{for(let r of visible){if(r===selected)continue;ctx.strokeStyle='rgba(87,186,207,.35)';ctx.lineWidth=1.2;path(r);ctx.stroke()}}
 if(selected){ctx.strokeStyle='#ffdf75';ctx.lineWidth=3;path(selected);ctx.stroke()}}
function fmt(r){let km=r.distance/1000,pace=r.duration>0&&km>0?r.duration/km:null;return `${km.toFixed(2)} km · ${pace?Math.floor(Math.round(pace)/60)+':'+String(Math.round(pace)%60).padStart(2,'0')+' /km':'pace unavailable'}`}
function update(){let km=visible.reduce((n,r)=>n+r.distance,0)/1000;$('summary').innerHTML=`<strong>${visible.length}</strong> runs · <strong>${km.toFixed(1)} km</strong><br><span class="hint">Pace uses elapsed stream time, including stops.</span>`;$('details').textContent=selected?`${selected.date?selected.date.slice(0,10):'Date unavailable'} · ${fmt(selected)} · ID ${selected.id}`:'Select a route on the map or a run below to see its details.';let list=$('runs');list.replaceChildren();for(let r of visible){let b=document.createElement('button');b.className='run'+(r===selected?' selected':'');b.textContent=`${r.date?r.date.slice(0,10):'Unknown date'} · ${fmt(r)}`;b.onclick=()=>{selected=r;update();draw()};list.append(b)}}
function distanceToSegment(x,y,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)}
canvas.addEventListener('pointerdown',e=>{drag={x:e.offsetX,y:e.offsetY,moved:false};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.abs(dx)+Math.abs(dy)>1)drag.moved=true;view.x-=dx/view.scale;view.y+=dy/view.scale;drag.x=e.offsetX;drag.y=e.offsetY;draw()});canvas.addEventListener('pointerup',e=>{if(drag&&!drag.moved){let best=8,found=null;for(let r of visible){for(let i=1;i<r.xy.length;i++){let dist=distanceToSegment(e.offsetX,e.offsetY,screen(r.xy[i-1]),screen(r.xy[i]));if(dist<best){best=dist;found=r}}}selected=found;update();draw()}drag=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();let x=e.offsetX-canvas.clientWidth/2,y=canvas.clientHeight/2-e.offsetY,old=view.scale;view.scale*=Math.exp(-e.deltaY*.001);view.x+=x/old-x/view.scale;view.y+=y/old-y/view.scale;draw()},{passive:false});
$('region').onchange=filter;$('from').onchange=filter;$('to').onchange=filter;$('mode').onchange=draw;$('fit').onclick=fit;$('export').onclick=()=>{let a=document.createElement('a');a.download='run-explorer.png';a.href=canvas.toDataURL('image/png');a.click()};window.addEventListener('resize',draw);
fetch('/data').then(r=>r.json()).then(rows=>{data=rows;for(let r of data)r.xy=r.points.map(project);buildGroups();filter();if(!data.length)$('summary').textContent='No runs with GPS data found in my_data.'}).catch(()=>{$('summary').textContent='Could not load run data. Start the app with run_explorer.py.'});
</script></body></html>
